name: validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 */3 *"   # quarterly re-verification reminder: runs the link check
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema
      - run: python validate.py graph.json
      - name: Link check (scheduled runs only; informational)
        if: github.event_name == 'schedule'
        run: python validate.py graph.json --links || true
      - name: Upload link report
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with: { name: link-report, path: link-report.json }
