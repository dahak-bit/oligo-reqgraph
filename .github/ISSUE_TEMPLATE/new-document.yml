name: Missing document
description: Propose a document that should be in the graph.
title: "[add] <short title>"
labels: [addition]
body:
  - type: input
    id: title
    attributes: { label: Full title }
    validations: { required: true }
  - type: input
    id: issuer
    attributes: { label: Issuing body and reference number }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Official URL }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why it matters for oligonucleotide therapeutics, description: Which consideration or programme type does it govern? }
    validations: { required: true }
  - type: input
    id: span
    attributes: { label: Applies from which gate to which gate?, placeholder: "CTA / IND → Filing & approval" }
